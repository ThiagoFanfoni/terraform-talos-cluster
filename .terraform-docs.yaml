formatter: markdown table

sections:
  hide: [providers]

content: |-
  <!-- markdownlint-disable -->
  {{ .Content }}
  <!-- markdownlint-enable -->

output:
  file: README.md
  mode: inject

recursive:
  enabled: true
  path: .
  include-main: true

settings:
  escape: true
  hide-empty: true
  lockfile: false

sort:
  enabled: true
  by: name
