name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the latest main branch and tags
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/release.yaml

      - name: Set up Go for terraform-docs
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"
          cache: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6.3.2
        with:
          tflint_version: "v0.64.0"

      - name: Cache pre-commit environments
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml', '.github/workflows/release.yaml') }}

      - name: Run pre-commit
        run: |
          python -m pip install pre-commit==4.6.2
          tflint --init
          pre-commit run --all-files --show-diff-on-failure

      - name: Check Conventional Commits
        uses: cocogitto/cocogitto-action@v4.1.0
        with:
          command: check
          git-user: github-actions[bot]
          git-user-email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Create changelog, tag, and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cog bump --auto
          tag=$(git describe --tags --exact-match --match 'v[0-9]*' HEAD 2>/dev/null) || exit 0

          git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag"
          gh release view "$tag" > /dev/null 2>&1 && exit 0

          notes=$(cog changelog --at "$tag" --template full_hash)
          gh release create "$tag" --verify-tag --title "$tag" --notes "$notes"
