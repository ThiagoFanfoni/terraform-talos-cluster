name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the latest main branch and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Check Conventional Commits
        uses: cocogitto/cocogitto-action@9a9fe03b31c47444290c0d7f9b1ee1b44ee13f20 # v4.1.0
        with:
          command: check
          git-user: github-actions[bot]
          git-user-email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Create changelog, tag, and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cog bump --auto
          tag=$(git describe --tags --exact-match --match 'v[0-9]*' HEAD 2>/dev/null) || exit 0

          git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag"
          gh release view "$tag" > /dev/null 2>&1 && exit 0

          notes=$(cog changelog --at "$tag" --template full_hash)
          gh release create "$tag" --verify-tag --title "$tag" --notes "$notes"
